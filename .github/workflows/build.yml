# Tests every push; builds and publishes the image when sittich/config.yaml
# has a version that is not on ghcr.io yet. Published versions are never
# overwritten. Actions are pinned to commit hashes, which cannot be moved.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in a row must not race to publish the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies (hash-checked)
        run: |
          pip install --require-hashes --only-binary=:all: -r sittich/requirements.txt
          pip install pytest==9.1.1
      - name: Run tests
        run: python -m pytest -q tests

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version and image from config.yaml
        id: meta
        run: |
          version=$(sed -n 's/^version: *"\?\([^"]*\)"\?$/\1/p' sittich/config.yaml)
          image=$(sed -n 's/^image: *//p' sittich/config.yaml | sed 's/{arch}/amd64/')
          expected="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amd64-sittich"
          if [ "$image" != "$expected" ]; then
            echo "::error file=sittich/config.yaml::'image:' must be ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/{arch}-sittich"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: published
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.meta.outputs.version }} exists, nothing to do. Raise 'version' in sittich/config.yaml to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.exists != 'true'

      - name: Build
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: sittich
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=amd64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          load: true
          provenance: false

      - name: Smoke test (model loads, server answers)
        if: steps.published.outputs.exists != 'true'
        run: |
          docker run -d --name smoke -p 10300:10300 \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          if ! python3 - <<'EOF'
          import json, socket, sys, time
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 10300), 3) as sock:
                      sock.sendall(b'{"type": "describe"}\n')
                      reply = sock.makefile("rb")
                      header = json.loads(reply.readline())
                      reply.read(header.get("data_length", 0))  # read all before closing
                  print("Server answered:", header["type"])
                  sys.exit(0 if header["type"] == "info" else 1)
              except (OSError, ValueError):
                  time.sleep(2)
          sys.exit("server did not come up")
          EOF
          then
            docker logs smoke
            exit 1
          fi
          docker logs smoke

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: sittich
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=amd64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          # Fixed timestamps in all layers: unchanged content keeps its digest,
          # so Home Assistant does not download the model again on updates.
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
